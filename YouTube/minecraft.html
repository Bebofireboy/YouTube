<html><head><title>Infinite Minecraft-like World</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; }
  #info {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
    pointer-events: none;
    z-index: 100;
  }
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    border: 2px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;
  }
</style>
</head>
<body>
<div id="info">Infinite Minecraft-like World<br>WASD to move, Space/Shift to fly up/down, Mouse to look<br>Left click: Place grass, Right click: Remove block</div>
<div id="crosshair"></div>
<script>
// Full code from the excellent single-file project
let scene, camera, renderer, controls;
let raycaster;
let world = {};
let chunkSize = 16;
let chunkHeight = 64;
let blockSize = 1;
let textureLoader, blockTextures;
let generatedChunks = new Set();
let chunks = {};
let renderDistance = 5;

const simplex = new SimplexNoise();

const atlasSize = 256;
const tileSize = 16;
const tilesPerRow = atlasSize / tileSize;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(8, 40, 8);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  textureLoader = new THREE.TextureLoader();
  blockTextures = textureLoader.load('https://minecraft.wiki/images/Rd-161348_terrain.png', function(texture) {
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    generateInitialChunks();
  });

  raycaster = new THREE.Raycaster();

  setupLights();
  setupControls();

  window.addEventListener('resize', onWindowResize, false);
  document.addEventListener('mousedown', onDocumentMouseDown, false);
  document.addEventListener('keydown', onKeyDown, false);
  document.addEventListener('keyup', onKeyUp, false);
  document.addEventListener('contextmenu', e => e.preventDefault());
}

function setupLights() {
  const ambientLight = new THREE.AmbientLight(0xcccccc, 0.6);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(50, 100, 30);
  scene.add(directionalLight);
}

function setupControls() {
  controls = new THREE.PointerLockControls(camera, document.body);
  document.addEventListener('click', () => controls.lock());
  scene.add(controls.getObject());
}

function generateInitialChunks() {
  const playerChunkX = Math.floor(camera.position.x / (chunkSize * blockSize));
  const playerChunkZ = Math.floor(camera.position.z / (chunkSize * blockSize));
  for (let x = -renderDistance; x <= renderDistance; x++) {
    for (let z = -renderDistance; z <= renderDistance; z++) {
      generateChunk(playerChunkX + x, playerChunkZ + z);
    }
  }
}

function generateChunk(chunkX, chunkZ) {
  const chunkKey = `${chunkX},${chunkZ}`;
  if (generatedChunks.has(chunkKey)) return;

  let positions = [], normals = [], uvs = [];

  for (let x = 0; x < chunkSize; x++) {
    for (let z = 0; z < chunkSize; z++) {
      let worldX = chunkX * chunkSize + x;
      let worldZ = chunkZ * chunkSize + z;
      let height = Math.floor(getNoiseHeight(worldX, worldZ));
      for (let y = 0; y <= height && y < chunkHeight; y++) {
        let type = y === height ? 'grass' : (y > height - 4 ? 'dirt' : 'stone');
        world[`${worldX},${y},${worldZ}`] = type;
      }
    }
  }

  // Build geometry with face culling
  for (let x = 0; x < chunkSize; x++) {
    for (let z = 0; z < chunkSize; z++) {
      for (let y = 0; y < chunkHeight; y++) {
        let worldX = chunkX * chunkSize + x;
        let worldY = y;
        let worldZ = chunkZ * chunkSize + z;
        let blockType = world[`${worldX},${worldY},${worldZ}`];
        if (blockType) {
          addBlockToChunk(x, y, z, blockType, worldX, worldY, worldZ, positions, normals, uvs);
        }
      }
    }
  }

  const chunkGeometry = new THREE.BufferGeometry();
  chunkGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  chunkGeometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  chunkGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));

  const chunkMesh = new THREE.Mesh(chunkGeometry, new THREE.MeshLambertMaterial({ map: blockTextures }));
  chunkMesh.position.set(chunkX * chunkSize, 0, chunkZ * chunkSize);
  scene.add(chunkMesh);

  chunks[chunkKey] = chunkMesh;
  generatedChunks.add(chunkKey);
}

function getNoiseHeight(x, z) {
  const scale = 0.02;
  let height = simplex.noise2D(x * scale, z * scale) * 12 + 20;
  return Math.max(5, height);
}

function addBlockToChunk(x, y, z, type, worldX, worldY, worldZ, positions, normals, uvs) {
  const topUVs = type === 'grass' ? getUVs(0, 0) : (type === 'dirt' ? getUVs(2, 0) : getUVs(1, 0));
  const sideUVs = type === 'grass' ? getUVs(3, 0) : (type === 'dirt' ? getUVs(2, 0) : getUVs(1, 0));
  const bottomUVs = getUVs(2, 0);

  // Top
  if (!world[`${worldX},${worldY+1},${worldZ}`]) addFace(x, y+1, z, x, y+1, z+1, x+1, y+1, z+1, x+1, y+1, z, 0, 1, 0, topUVs, positions, normals, uvs);
  // Bottom
  if (!world[`${worldX},${worldY-1},${worldZ}`]) addFace(x, y, z+1, x, y, z, x+1, y, z, x+1, y, z+1, 0, -1, 0, bottomUVs, positions, normals, uvs);
  // Front
  if (!world[`${worldX},${worldY},${worldZ+1}`]) addFace(x+1, y+1, z+1, x, y+1, z+1, x, y, z+1, x+1, y, z+1, 0, 0, 1, sideUVs, positions, normals, uvs);
  // Back
  if (!world[`${worldX},${worldY},${worldZ-1}`]) addFace(x, y+1, z, x+1, y+1, z, x+1, y, z, x, y, z, 0, 0, -1, sideUVs, positions, normals, uvs);
  // Right
  if (!world[`${worldX+1},${worldY},${worldZ}`]) addFace(x+1, y+1, z, x+1, y+1, z+1, x+1, y, z+1, x+1, y, z, 1, 0, 0, sideUVs, positions, normals, uvs);
  // Left
  if (!world[`${worldX-1},${worldY},${worldZ}`]) addFace(x, y+1, z+1, x, y+1, z, x, y, z, x, y, z+1, -1, 0, 0, sideUVs, positions, normals, uvs);
}

function addFace(x1,y1,z1, x2,y2,z2, x3,y3,z3, x4,y4,z4, nx,ny,nz, uv, positions, normals, uvs) {
  positions.push(x1,y1,z1, x2,y2,z2, x3,y3,z3, x1,y1,z1, x3,y3,z3, x4,y4,z4);
  for (let i = 0; i < 6; i++) normals.push(nx, ny, nz);
  uvs.push(uv[0].x, uv[0].y, uv[1].x, uv[1].y, uv[2].x, uv[2].y, uv[0].x, uv[0].y, uv[2].x, uv[2].y, uv[3].x, uv[3].y);
}

function getUVs(tileX, tileY) {
  const u = tileX / tilesPerRow;
  const v = 1 - (tileY + 1) / tilesPerRow;
  const s = 1 / tilesPerRow;
  return [
    new THREE.Vector2(u, v + s),
    new THREE.Vector2(u + s, v + s),
    new THREE.Vector2(u + s, v),
    new THREE.Vector2(u, v)
  ];
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onDocumentMouseDown(event) {
  if (!controls.isLocked) return;
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const intersects = raycaster.intersectObjects(Object.values(chunks));
  if (intersects.length > 0) {
    const intersect = intersects[0];
    const pos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(event.button === 0 ? 0.5 : -0.5)).floor();
    const x = Math.floor(pos.x), y = Math.floor(pos.y), z = Math.floor(pos.z);
    if (event.button === 0) placeBlock(x, y, z, 'grass');
    else if (event.button === 2) removeBlock(x, y, z);
  }
}

function placeBlock(x, y, z, type) {
  const key = `${x},${y},${z}`;
  if (world[key]) return;
  world[key] = type;
  updateChunksAroundBlock(x, y, z);
}

function removeBlock(x, y, z) {
  const key = `${x},${y},${z}`;
  if (!world[key]) return;
  delete world[key];
  updateChunksAroundBlock(x, y, z);
}

function updateChunksAroundBlock(x, y, z) {
  const cx = Math.floor(x / chunkSize), cz = Math.floor(z / chunkSize);
  [[cx,cz],[cx-1,cz],[cx+1,cz],[cx,cz-1],[cx,cz+1]].forEach(([cX, cZ]) => updateChunk(cX, cZ));
}

function updateChunk(chunkX, chunkZ) {
  const key = `${chunkX},${chunkZ}`;
  if (chunks[key]) {
    scene.remove(chunks[key]);
    chunks[key].geometry.dispose();
    delete chunks[key];
    generatedChunks.delete(key);
  }
  generateChunk(chunkX, chunkZ);
}

const moveSpeed = 0.2;
const moveState = {forward:false, backward:false, left:false, right:false, up:false, down:false};

function onKeyDown(e) {
  switch(e.code) {
    case 'KeyW': moveState.forward = true; break;
    case 'KeyS': moveState.backward = true; break;
    case 'KeyA': moveState.left = true; break;
    case 'KeyD': moveState.right = true; break;
    case 'Space': moveState.up = true; break;
    case 'ShiftLeft': case 'ShiftRight': moveState.down = true; break;
  }
}

function onKeyUp(e) {
  switch(e.code) {
    case 'KeyW': moveState.forward = false; break;
    case 'KeyS': moveState.backward = false; break;
    case 'KeyA': moveState.left = false; break;
    case 'KeyD': moveState.right = false; break;
    case 'Space': moveState.up = false; break;
    case 'ShiftLeft': case 'ShiftRight': moveState.down = false; break;
  }
}

function updatePosition() {
  const dir = new THREE.Vector3();
  if (moveState.forward) dir.z -= 1;
  if (moveState.backward) dir.z += 1;
  if (moveState.left) dir.x -= 1;
  if (moveState.right) dir.x += 1;
  if (moveState.up) camera.position.y += moveSpeed * 2;
  if (moveState.down) camera.position.y -= moveSpeed * 2;

  dir.normalize().multiplyScalar(moveSpeed);
  controls.moveRight(dir.x);
  controls.moveForward(-dir.z);

  checkAndGenerateChunks();
}

function checkAndGenerateChunks() {
  const px = Math.floor(camera.position.x / chunkSize);
  const pz = Math.floor(camera.position.z / chunkSize);
  for (let x = -renderDistance; x <= renderDistance; x++) {
    for (let z = -renderDistance; z <= renderDistance; z++) {
      const key = `${px + x},${pz + z}`;
      if (!generatedChunks.has(key)) generateChunk(px + x, pz + z);
    }
  }
  // Cleanup far chunks
  for (let key of Object.keys(chunks)) {
    const [cx, cz] = key.split(',').map(Number);
    if (Math.abs(cx - px) > renderDistance + 1 || Math.abs(cz - pz) > renderDistance + 1) {
      scene.remove(chunks[key]);
      chunks[key].geometry.dispose();
      delete chunks[key];
      generatedChunks.delete(key);
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  updatePosition();
  renderer.render(scene, camera);
}

init();
animate();
</script></body></html>
