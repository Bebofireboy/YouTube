<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mini Minecraft in One File</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
      z-index: 10;
      text-shadow: 0 0 5px black;
    }
    #ui button {
      margin-right: 5px;
    }
  </style>
</head>
<body>
<div id="ui">
  <button id="lockBtn">Click to capture mouse</button>
  <span>WASD: move | Mouse: look | LMB: remove | RMB: place | Space: jump</span>
</div>
<canvas id="c"></canvas>
<script>
// Basic setup
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
if (!gl) {
  alert('WebGL not supported');
}
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// Simple shader sources
const vsSource = `
attribute vec3 aPos;
attribute vec3 aColor;
uniform mat4 uProj;
uniform mat4 uView;
varying vec3 vColor;
void main() {
  vColor = aColor;
  gl_Position = uProj * uView * vec4(aPos, 1.0);
}
`;

const fsSource = `
precision mediump float;
varying vec3 vColor;
void main() {
  gl_FragColor = vec4(vColor, 1.0);
}
`;

// Compile shader
function compileShader(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}
const vs = compileShader(gl.VERTEX_SHADER, vsSource);
const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);

// Link program
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

// Locations
const aPosLoc = gl.getAttribLocation(prog, 'aPos');
const aColorLoc = gl.getAttribLocation(prog, 'aColor');
const uProjLoc = gl.getUniformLocation(prog, 'uProj');
const uViewLoc = gl.getUniformLocation(prog, 'uView');

// Simple math helpers
function mat4Perspective(out, fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy / 2);
  out[0] = f / aspect;
  out[1] = 0;
  out[2] = 0;
  out[3] = 0;

  out[4] = 0;
  out[5] = f;
  out[6] = 0;
  out[7] = 0;

  out[8] = 0;
  out[9] = 0;
  out[10] = (far + near) / (near - far);
  out[11] = -1;

  out[12] = 0;
  out[13] = 0;
  out[14] = (2 * far * near) / (near - far);
  out[15] = 0;
}

function mat4Look(out, eye, center, up) {
  const ex = eye[0], ey = eye[1], ez = eye[2];
  const cx = center[0], cy = center[1], cz = center[2];
  const ux = up[0], uy = up[1], uz = up[2];

  let zx = ex - cx, zy = ey - cy, zz = ez - cz;
  let len = Math.hypot(zx, zy, zz);
  zx /= len; zy /= len; zz /= len;

  let xx = uy * zz - uz * zy;
  let xy = uz * zx - ux * zz;
  let xz = ux * zy - uy * zx;
  len = Math.hypot(xx, xy, xz);
  xx /= len; xy /= len; xz /= len;

  let yx = zy * xz - zz * xy;
  let yy = zz * xx - zx * xz;
  let yz = zx * xy - zy * xx;

  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * ex + xy * ey + xz * ez);
  out[13] = -(yx * ex + yy * ey + yz * ez);
  out[14] = -(zx * ex + zy * ey + zz * ez);
  out[15] = 1;
}

// World data: simple flat terrain
const worldSize = 16;
let blocks = new Map(); // key "x,y,z" -> color

function key(x,y,z){ return x+','+y+','+z; }

function addBlock(x,y,z,color) {
  blocks.set(key(x,y,z), color);
}
function removeBlock(x,y,z) {
  blocks.delete(key(x,y,z));
}
function getBlock(x,y,z) {
  return blocks.get(key(x,y,z));
}

// Generate flat ground
for (let x=0; x<worldSize; x++) {
  for (let z=0; z<worldSize; z++) {
    addBlock(x,0,z,[0.3+0.1*Math.random(),0.8,0.3]);
  }
}

// Player state
let px = worldSize/2;
let py = 2;
let pz = worldSize/2;
let yaw = 0;
let pitch = 0;
let velY = 0;
let onGround = false;

// Input
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Pointer lock for mouse look
const lockBtn = document.getElementById('lockBtn');
lockBtn.onclick = () => {
  canvas.requestPointerLock();
};
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === canvas) {
    lockBtn.textContent = 'Mouse captured';
  } else {
    lockBtn.textContent = 'Click to capture mouse';
  }
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === canvas) {
    const sensitivity = 0.002;
    yaw -= e.movementX * sensitivity;
    pitch -= e.movementY * sensitivity;
    const limit = Math.PI/2 - 0.01;
    if (pitch > limit) pitch = limit;
    if (pitch < -limit) pitch = -limit;
  }
});

// Mouse click: place/remove blocks
canvas.addEventListener('mousedown', e => {
  const left = e.button === 0;
  const right = e.button === 2;
  if (!left && !right) return;

  // Raycast from player
  const dir = [
    Math.cos(pitch)*Math.sin(yaw),
    Math.sin(pitch),
    Math.cos(pitch)*Math.cos(yaw)
  ];
  let t = 0;
  let hitPos = null;
  let hitNormal = null;

  for (let i=0; i<100; i++) {
    t += 0.2;
    const rx = px + dir[0]*t;
    const ry = py + dir[1]*t;
    const rz = pz + dir[2]*t;
    const bx = Math.floor(rx);
    const by = Math.floor(ry);
    const bz = Math.floor(rz);
    if (getBlock(bx,by,bz)) {
      hitPos = [bx,by,bz];
      // approximate normal by checking neighbor
      const nx = rx - bx;
      const ny = ry - by;
      const nz = rz - bz;
      if (Math.abs(nx) > Math.abs(ny) && Math.abs(nx) > Math.abs(nz)) {
        hitNormal = [nx>0?1:-1,0,0];
      } else if (Math.abs(ny) > Math.abs(nx) && Math.abs(ny) > Math.abs(nz)) {
        hitNormal = [0,ny>0?1:-1,0];
      } else {
        hitNormal = [0,0,nz>0?1:-1];
      }
      break;
    }
  }

  if (hitPos) {
    const [bx,by,bz] = hitPos;
    if (left) {
      removeBlock(bx,by,bz);
    } else if (right && hitNormal) {
      const nx = bx + hitNormal[0];
      const ny = by + hitNormal[1];
      const nz = bz + hitNormal[2];
      if (!getBlock(nx,ny,nz)) {
        addBlock(nx,ny,nz,[0.6,0.4,0.2]);
      }
    }
  }
});

// Prevent context menu on right click
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Build geometry each frame
const posBuffer = gl.createBuffer();
const colorBuffer = gl.createBuffer();

function buildGeometry() {
  const positions = [];
  const colors = [];

  function pushCube(x,y,z,color) {
    const [r,g,b] = color;
    const s = 1;
    const x0 = x, x1 = x+s;
    const y0 = y, y1 = y+s;
    const z0 = z, z1 = z+s;

    function face(a,b,c,d,cr,cg,cb) {
      positions.push(...a, ...b, ...c, ...a, ...c, ...d);
      for (let i=0;i<6;i++) colors.push(cr,cg,cb);
    }

    // Only add faces that are exposed (no neighbor)
    const neighbors = [
      [x+1,y,z], [x-1,y,z],
      [x,y+1,z], [x,y-1,z],
      [x,y,z+1], [x,y,z-1]
    ];

    // +X
    if (!getBlock(x+1,y,z)) face([x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],r,g,b);
    // -X
    if (!getBlock(x-1,y,z)) face([x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[x0,y0,z0],r,g,b);
    // +Y
    if (!getBlock(x,y+1,z)) face([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],r,g,b);
    // -Y
    if (!getBlock(x,y-1,z)) face([x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0],r,g,b);
    // +Z
    if (!getBlock(x,y,z+1)) face([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],r,g,b);
    // -Z
    if (!getBlock(x,y,z-1)) face([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],r,g,b);
  }

  for (const [k,color] of blocks.entries()) {
    const [x,y,z] = k.split(',').map(Number);
    pushCube(x,y,z,color);
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aPosLoc);
  gl.vertexAttribPointer(aPosLoc, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aColorLoc);
  gl.vertexAttribPointer(aColorLoc, 3, gl.FLOAT, false, 0, 0);

  return positions.length/3;
}

// Game loop
let lastTime = performance.now();
function loop(now) {
  const dt = (now - lastTime)/1000;
  lastTime = now;

  // Movement
  const speed = 5;
  let dx = 0, dz = 0;
  if (keys['KeyW']) dz -= 1;
  if (keys['KeyS']) dz += 1;
  if (keys['KeyA']) dx -= 1;
  if (keys['KeyD']) dx += 1;
  const len = Math.hypot(dx,dz);
  if (len>0) { dx/=len; dz/=len; }

  const sinY = Math.sin(yaw);
  const cosY = Math.cos(yaw);
  const vx = (dx*cosY - dz*sinY)*speed;
  const vz = (dx*sinY + dz*cosY)*speed;

  px += vx*dt;
  pz += vz*dt;

  // Gravity & jumping
  const gravity = -15;
  velY += gravity*dt;
  py += velY*dt;

  if (py < 1.01) { // simple ground collision
    py = 1.01;
    velY = 0;
    onGround = true;
  } else {
    onGround = false;
  }

  if (keys['Space'] && onGround) {
    velY = 7;
    onGround = false;
  }

  // Clear
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.5,0.7,1.0,1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // Matrices
  const proj = new Float32Array(16);
  mat4Perspective(proj, Math.PI/3, canvas.width/canvas.height, 0.1, 100.0);
  gl.uniformMatrix4fv(uProjLoc, false, proj);

  const dir = [
    Math.cos(pitch)*Math.sin(yaw),
    Math.sin(pitch),
    Math.cos(pitch)*Math.cos(yaw)
  ];
  const center = [px+dir[0], py+dir[1], pz+dir[2]];
  const view = new Float32Array(16);
  mat4Look(view, [px,py,pz], center, [0,1,0]);
  gl.uniformMatrix4fv(uViewLoc, false, view);

  // Draw world
  const count = buildGeometry();
  gl.drawArrays(gl.TRIANGLES, 0, count);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
